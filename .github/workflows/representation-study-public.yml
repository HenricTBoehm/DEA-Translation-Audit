name: Representation study public verification
on:
  push:
    branches: [research/dea-ai-representation-v011-review]
  pull_request:
    branches: [research/operational-evidence-phase-c-v01]
    types: [opened, synchronize, reopened]
    paths: ['research/DEA-AI-Representation-Study/**']
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash research/DEA-AI-Representation-Study/v0.1.1-candidate/verify-public.sh
